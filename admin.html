<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff">
<title>TikTok Exchange — Admin</title>
<link rel="manifest" href="/manifest.json"><link rel="icon" type="image/png" sizes="192x192" href="/assets/tiktok-icon-192.png">
<style>
:root{--bg:#fff;--card:#fff;--soft:#f7f7f8;--text:#161823;--muted:#6b6b73;--line:#e7e7e9;--pink:#fe2c55;--cyan:#25f4ee;--danger:#e51c43;--green:#0b9f67;--shadow:0 8px 30px rgba(22,24,35,.06)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}button,input,select{font:inherit}.shell{max-width:1280px;margin:auto;padding:22px 24px 48px}.top{height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);margin-bottom:24px}.brand{display:flex;align-items:center;gap:12px}.brand img{display:none}.brand h1{font-size:20px;margin:0}.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.top-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;color:var(--text);height:40px;padding:0 14px;border-radius:9px;font-weight:700;cursor:pointer}.btn:hover{background:var(--soft)}.btn.primary{background:var(--pink);border-color:var(--pink);color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{border:1px solid var(--line);border-radius:12px;padding:17px;background:#fff}.stat span{font-size:12px;color:var(--muted)}.stat strong{display:block;font-size:27px;margin-top:5px}.panel{border:1px solid var(--line);border-radius:14px;background:#fff;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}.panel h2{font-size:18px;margin:0}.panel p{color:var(--muted);font-size:12px;margin:4px 0 0}.form{display:grid;grid-template-columns:1fr 1fr .8fr auto;gap:10px;align-items:end}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field input,.field select,.search{width:100%;height:44px;border:1px solid #d9d9dc;border-radius:9px;background:#fff;color:var(--text);padding:0 12px;outline:none;font-size:14px}.field input:focus,.field select:focus,.search:focus{border-color:#161823;box-shadow:0 0 0 1px #161823}.custom{display:none;grid-template-columns:1fr 180px;gap:10px;margin-top:10px}.custom.open{display:grid}.msg{font-size:12px;color:var(--danger);min-height:17px;margin-top:9px}.search{max-width:300px}.users{display:grid;gap:9px}.user{display:grid;grid-template-columns:minmax(210px,1fr) minmax(170px,.75fr) auto;gap:14px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:11px}.identity{display:flex;align-items:center;gap:12px;min-width:0}.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:#ffd632;color:#111;display:grid;place-items:center;font-weight:800;font-size:19px}.who{min-width:0}.who strong,.who span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who strong{font-size:14px}.who span{font-size:12px;color:var(--muted);margin-top:2px}.social{font-size:12px;color:var(--muted);line-height:1.5}.social b{color:var(--text);font-weight:600}.time{font-size:12px}.status{display:inline-block;margin-top:5px;padding:3px 7px;border-radius:999px;background:#eaf8f2;color:var(--green);font-weight:700;font-size:10px}.status.expired{background:#fff0f2;color:var(--danger)}.status.offline{background:#f1f1f2;color:#6b6b73}.password{font-size:12px;color:var(--muted);margin-top:4px}.password code{color:var(--text);background:var(--soft);padding:2px 5px;border-radius:5px}.actions{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}.mini{height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 9px;font-size:11px;font-weight:700;cursor:pointer}.mini:hover{background:var(--soft)}.mini.danger{color:#fff;background:#e51c43;border-color:#e51c43}.mini.add{color:#fff;background:#0b9f67;border-color:#0b9f67}.mini.reduce{color:#fff;background:#d9363e;border-color:#d9363e}.mini.password-btn{color:#5b4700;background:#ffd84d;border-color:#ffd84d}.empty{text-align:center;padding:34px;color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:11px}.footer{text-align:center;color:#8a8a91;font-size:11px;padding:14px}.footer strong{color:var(--text)}
@media(max-width:920px){.form{grid-template-columns:1fr 1fr}.user{grid-template-columns:1fr 1fr}.actions{justify-content:flex-start}}@media(max-width:620px){.shell{padding:12px 12px 32px}.top{height:auto;padding:8px 0 16px;align-items:flex-start}.brand small{display:none}.top-actions .btn:first-child{display:none}.stats{grid-template-columns:repeat(3,1fr);gap:7px}.stat{padding:12px 10px}.stat strong{font-size:21px}.panel{padding:14px;border-radius:12px;box-shadow:none}.panel-head{align-items:stretch;flex-direction:column}.search{max-width:none}.form,.custom,.user{grid-template-columns:1fr}.user{gap:10px}.time{padding-left:0}.actions{display:grid;grid-template-columns:repeat(2,1fr)}.mini{height:39px}.btn{height:42px}.form>.btn{width:100%}}
</style><link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
</head><body><main class="shell">
<header class="top"><div class="brand"><div><h1>Admin Panel</h1><small>User access management</small></div></div><div class="top-actions"><button class="btn" onclick="location.href='/'">Open app</button><button class="btn" id="logout">Log out</button></div></header>
<section class="stats"><div class="stat"><span>Total users</span><strong id="total">—</strong></div><div class="stat"><span>Active</span><strong id="active">—</strong></div><div class="stat"><span>Expired</span><strong id="expired">—</strong></div></section>
<section class="panel"><div class="panel-head"><div><h2>Create user</h2><p>Create a time-limited login account.</p></div></div><form class="form" id="create"><div class="field"><label>Username / TikTok username</label><input id="newUser" autocomplete="off" placeholder="username" required></div><div class="field"><label>Password</label><input id="newPass" type="password" autocomplete="new-password" placeholder="Minimum 4 characters" required></div><div class="field"><label>Access period</label><select id="duration"><option value="600000">10 minutes</option><option value="1800000">30 minutes</option><option value="3600000">1 hour</option><option value="86400000">1 day</option><option value="604800000">1 week</option><option value="2592000000">1 month</option><option value="5184000000">2 months</option><option value="custom">Custom</option></select></div><button class="btn primary">Create user</button></form><div class="custom" id="custom"><div class="field"><label>Amount</label><input id="customAmount" type="number" min="1" value="1"></div><div class="field"><label>Unit</label><select id="customUnit"><option value="86400000" selected>Days</option><option value="604800000">Weeks</option><option value="2592000000">Months (30 days)</option></select></div></div><div class="msg" id="msg"></div></section>
<section class="panel"><div class="panel-head"><div><h2>Users</h2><p>Manage usernames, passwords and access time.</p></div><input id="search" class="search" placeholder="Search user"></div><div id="users" class="users"><div class="empty">Loading users…</div></div></section>
<footer class="footer">© 2026 <strong>FimponG</strong>. All rights reserved.</footer></main>
<script>
const token=localStorage.getItem('walletAuthToken');const headers={'Content-Type':'application/json',Authorization:`Bearer ${token}`};let all=[];const profileCache=new Map();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){const r=await fetch(url,{...opt,headers});let d={};try{d=await r.json()}catch{}if(r.status===401||r.status===403){if(url.includes('/api/session')){localStorage.removeItem('walletAuthToken');location.href='/login.html'}throw new Error(d.error||'Unauthorized')}if(!r.ok)throw new Error(d.error||'Request failed');return d}
function letter(name){return (String(name).replace(/^@/,'').trim()[0]||'?').toUpperCase()}function fmt(n){if(!Number.isFinite(Number(n)))return'—';return new Intl.NumberFormat().format(Number(n))}function remain(t){let m=Number(t)-Date.now();if(m<=0)return'Expired';let d=Math.floor(m/86400000);let h=Math.floor(m%86400000/3600000);let min=Math.ceil(m%3600000/60000);return d?`${d}d ${h}h`:h?`${h}h ${min}m`:`${min}m`}
async function getProfile(username){const key=username.toLowerCase();if(profileCache.has(key))return profileCache.get(key);try{const d=await api('/api/tiktok-user?username='+encodeURIComponent(username));const p=d?.data?.user||null;const matched=p&&String(p.unique_id||'').toLowerCase()===key&&p.nickname&&p.nickname!==username;const useful=matched||p?.avatar||Number.isFinite(p?.follower_count)||Number.isFinite(p?.following_count);const out=useful?{...p,matched:true}:null;profileCache.set(key,out);return out}catch{profileCache.set(key,null);return null}}
function avatarMarkup(u,p){if(p?.avatar)return `<img class="avatar" src="${esc(p.avatar)}" alt="" onerror="this.outerHTML='<span class=&quot;avatar&quot;>${esc(letter(u.username))}</span>'">`;return `<span class="avatar">${esc(letter(u.username))}</span>`}
async function render(list){total.textContent=all.length;active.textContent=all.filter(x=>x.activatedAt&&x.expiresAt&&x.expiresAt>Date.now()).length;expired.textContent=all.filter(x=>x.activatedAt&&x.expiresAt&&x.expiresAt<=Date.now()).length;if(!list.length){users.innerHTML='<div class="empty">No users found.</div>';return}users.innerHTML=list.map(u=>`<article class="user" data-id="${esc(u.id)}"><div class="who"><strong>${esc(u.username)}</strong><div class="password">Password: <code>${u.password?esc(u.password):'Reset to reveal'}</code></div></div><div class="time"><b>${esc(!u.activatedAt ? 'Time: '+formatDuration(u.accessDurationMs) : 'Time left: '+remain(u.expiresAt))}</b><br><span class="status ${!u.activatedAt?'offline':u.expiresAt<=Date.now()?'expired':''}">${!u.activatedAt?'Offline':u.expiresAt<=Date.now()?'Expired':'Active'}</span></div><div class="actions"><button class="mini add" data-a="add">+ Time</button><button class="mini reduce" data-a="reduce">− Time</button><button class="mini password-btn" data-a="password">Change Password</button><button class="mini danger" data-a="delete">Delete User</button></div></article>`).join('')}
function formatDuration(ms){ms=Number(ms)||0;const d=Math.floor(ms/86400000),h=Math.floor(ms%86400000/3600000),m=Math.ceil(ms%3600000/60000);return d?`${d}d ${h}h`:h?`${h}h ${m}m`:`${m}m`}
async function load(){try{await api('/api/session');all=await api('/api/admin/users');render(all)}catch(e){msg.textContent=e.message}}
duration.onchange=()=>custom.classList.toggle('open',duration.value==='custom');create.onsubmit=async e=>{e.preventDefault();msg.textContent='';let durationMs=duration.value==='custom'?Number(customAmount.value)*Number(customUnit.value):Number(duration.value);try{await api('/api/admin/users',{method:'POST',body:JSON.stringify({username:newUser.value.replace(/^@/,''),password:newPass.value,durationMs})});create.reset();custom.classList.remove('open');await load()}catch(e){msg.textContent=e.message}};
search.oninput=()=>{const q=search.value.trim().toLowerCase();render(all.filter(u=>u.username.toLowerCase().includes(q)))};
users.onclick=async e=>{const b=e.target.closest('button[data-a]');if(!b)return;const row=b.closest('.user'),id=row.dataset.id,u=all.find(x=>x.id===id);if(!u)return;try{if(b.dataset.a==='delete'){if(!confirm(`Delete ${u.username}?`))return;await api('/api/admin/users/'+id,{method:'DELETE'})}else if(b.dataset.a==='password'){const v=prompt(`New password for ${u.username}:`);if(!v)return;await api('/api/admin/users/'+id,{method:'PUT',body:JSON.stringify({password:v})})}else{const raw=prompt(`${b.dataset.a==='add'?'Add':'Reduce'} how many days?`,'1');if(!raw)return;const days=Number(raw);if(!Number.isFinite(days)||days<=0)return alert('Enter a valid number of days.');await api('/api/admin/users/'+id,{method:'PUT',body:JSON.stringify({adjustMs:(b.dataset.a==='add'?1:-1)*days*86400000})})}await load()}catch(err){alert(err.message)}};
logout.onclick=async()=>{try{await api('/api/logout',{method:'POST'})}catch{}localStorage.removeItem('walletAuthToken');location.href='/login.html'};load();setInterval(()=>{if(all.length)render(all.filter(u=>u.username.toLowerCase().includes(search.value.trim().toLowerCase())))},60000);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js', { scope: '/' }).catch(() => {});
  });
}
</script>
</body></html>
